name: Build & Test

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: pdo, pdo_pgsql, mbstring, curl
        tools: composer:v2
    
    - name: Validate composer.json
      run: composer validate --strict
    
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
    
    - name: Check PHP syntax
      run: |
        for file in $(find . -name "*.php" -not -path "./vendor/*"); do
          php -l "$file" || exit 1
        done
    
    - name: Run tests (if available)
      run: |
        if [ -f "phpunit.xml" ] || [ -f "phpunit.xml.dist" ]; then
          composer test
        else
          echo "No test configuration found, skipping tests"
        fi
    
    - name: Check code quality (if standards defined)
      run: |
        if [ -f ".phpcs.xml" ] || [ -f ".phpcs.xml.dist" ]; then
          composer lint
        else
          echo "No coding standards defined, skipping PHPCS"
        fi
    
    - name: Build artifacts
      run: |
        # Clean up unnecessary files
        rm -rf .git .github node_modules .env.example
        echo "Build completed successfully"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: autoparts-build-php${{ matrix.php-version }}
        path: |
          !vendor/twbs/bootstrap
          !.git
          !node_modules
        retention-days: 30
