name: Code Quality & Lint

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer:v2, phpstan, phpmd
    
    - name: Install dependencies
      run: composer install --prefer-dist
    
    - name: Run PHPStan (Static Analysis)
      run: |
        if command -v phpstan &> /dev/null; then
          phpstan analyse App/ --level=5 || true
        else
          echo "PHPStan not installed, installing..."
          composer require --dev phpstan/phpstan
          ./vendor/bin/phpstan analyse App/ --level=5 || true
        fi
    
    - name: Check file permissions
      run: |
        echo "Checking file permissions..."
        find . -type f -name "*.php" -not -path "./vendor/*" | head -20
    
    - name: Security audit
      run: |
        composer audit --dry-run || true
    
    - name: Summary
      run: |
        echo "✓ Code quality checks completed"
        echo "✓ For issues found above, please review and fix locally"
