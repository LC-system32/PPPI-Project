name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo, pdo_pgsql, mbstring, curl
        tools: composer:v2
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-dev --optimize-autoloader
    
    - name: Validate environment
      run: |
        if [ ! -f ".env" ]; then
          echo "Error: .env file not found!"
          exit 1
        fi
        echo "Environment validation passed"
    
    - name: Check database connection
      run: |
        echo "Database configuration check:"
        php -r "
        require 'config/database.php';
        echo 'Database config loaded successfully';
        "
    
    - name: Generate deployment package
      run: |
        mkdir -p build
        rsync -av --exclude='tests' --exclude='.git' --exclude='node_modules' --exclude='.env.example' . build/
        cd build && zip -r ../autoparts-release.zip . -x "*.git*" "tests/*" "node_modules/*"
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release ${{ github.run_number }}
        body: Automated release from branch ${{ github.ref }}
        draft: false
        prerelease: false
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./autoparts-release.zip
        asset_name: autoparts-release-v${{ github.run_number }}.zip
        asset_content_type: application/zip
    
    - name: Deployment notification
      run: echo "Deployment completed successfully!"
